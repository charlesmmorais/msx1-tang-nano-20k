name: Verilog Lint

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint Verilog Files

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Icarus Verilog
      run: sudo apt-get install -y iverilog

    - name: Syntax check all Verilog files
      run: |
        echo "Checking Verilog syntax..."
        ERRORS=0
        for f in $(find src -name "*.v"); do
          echo "Checking: $f"
          if ! iverilog -t null -Wall "$f" 2>/dev/null; then
            echo "  ❌ Syntax error in $f"
            ERRORS=$((ERRORS + 1))
          else
            echo "  ✅ OK"
          fi
        done
        echo ""
        if [ $ERRORS -gt 0 ]; then
          echo "❌ $ERRORS file(s) have syntax errors"
          exit 1
        else
          echo "✅ All files passed syntax check"
        fi

    - name: Check file structure
      run: |
        echo "Checking project file structure..."
        REQUIRED=(
          "src/top.v"
          "src/cpu/z80_cpu.v"
          "src/cpu/z80_alu.v"
          "src/vdp/tms9918a.v"
          "src/psg/ay8910.v"
          "src/ppi/ppi8255.v"
          "src/keyboard/ps2_decoder.v"
          "src/keyboard/msx_keymap.v"
          "src/video/tmds_encoder.v"
          "src/video/hdmi_out.v"
          "src/audio/pdm_dac.v"
          "constraints/tang_nano_20k.cst"
        )
        for f in "${REQUIRED[@]}"; do
          if [ ! -f "$f" ]; then
            echo "❌ Missing: $f"
            exit 1
          fi
          echo "✅ Found: $f"
        done
