name: Simulation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  sim:
    runs-on: ubuntu-latest
    name: System simulation (Icarus Verilog)
    steps:
      - uses: actions/checkout@v4

      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: Run the system testbench
        run: |
          sh sim/run.sh | tee sim.log
          grep -q '^PASS' sim.log
